name: Build UltraDefrag4Linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ntfs-3g ntfs-3g-dev pkg-config libfuse3-dev

      - name: Build UltraDefrag4Linux
        working-directory: src
        run: |
          make CFLAGS='-Wno-implicit-function-declaration'

      - name: Verify build output
        run: ls -l src/udefrag

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ultradefrag4linux-binary
          path: src/udefrag
